version: 2

# Monthly: there are no NuGet dependencies beyond the SDK, so this is mostly the Actions.
updates:
  - package-ecosystem: nuget
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
