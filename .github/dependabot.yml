version: 2

# Monthly: the app itself has no NuGet dependencies beyond the SDK; the test project's xunit packages and the
# Actions are what this keeps current.
updates:
  - package-ecosystem: nuget
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
